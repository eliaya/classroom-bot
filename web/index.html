<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon_light.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Classroom Bot Admin</title>
    <meta name="title" content="Classroom Bot Admin" />
    <meta
      name="description"
      content="Google Classroom sync dashboard — manage courses, stream, classwork, and people from local SQLite cache."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#fff" />
    <!-- The last theme of this area (src/lib/theme.ts caches it), before React: no flash of the built-in colours. -->
    <script>
      try {
        var area = /^\/admin(\/|$)/.test(location.pathname) ? '/admin' : ''
        var saved = JSON.parse(localStorage.getItem('theme-css:' + area) || 'null')
        if (saved && typeof saved.css === 'string') {
          var style = document.createElement('style')
          style.id = 'theme-tokens'
          style.textContent = saved.css
          document.head.appendChild(style)
          document.documentElement.setAttribute('data-theme', '')
          ;(saved.fonts || []).forEach(function (href) {
            var link = document.createElement('link')
            link.rel = 'stylesheet'
            link.href = href
            link.setAttribute('data-theme-font', '')
            document.head.appendChild(link)
          })
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
